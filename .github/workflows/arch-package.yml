name: Build Arch package

on:
  push:
    branches: [ddc-brightness-range-guard]
  workflow_dispatch:
    inputs:
      arch_snapshot:
        description: 'Optional Arch Linux Archive date (YYYY-MM-DD) for a matching Qt build'
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Arch build requirements
        env:
          ARCH_SNAPSHOT: ${{ inputs.arch_snapshot }}
        run: |
          case "$ARCH_SNAPSHOT" in
            '') pacman -Syu --noconfirm ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
              snapshot_path=$(printf '%s' "$ARCH_SNAPSHOT" | tr '-' '/')
              printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$snapshot_path" > /etc/pacman.d/mirrorlist
              pacman -Syyuu --noconfirm
              ;;
            *) echo 'arch_snapshot must use YYYY-MM-DD' >&2; exit 1 ;;
          esac
          pacman -S --needed --noconfirm base-devel git sudo
          useradd --create-home build
          echo 'build ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/build
          chmod 0440 /etc/sudoers.d/build
          chown -R build:build "$GITHUB_WORKSPACE"
      - name: Build package
        run: |
          for attempt in 1 2 3; do
            su build -c "cd '$GITHUB_WORKSPACE/arch' && makepkg -C -f --noconfirm --syncdeps --nocheck" && exit 0
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 10))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: powerdevil-arch-package
          path: arch/*.pkg.tar.zst
          if-no-files-found: error
